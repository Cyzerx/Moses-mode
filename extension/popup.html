<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 2px; color: #444; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 5px; }
    button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
    #start { background: #1d4ed8; color: #fff; border: 0; border-radius: 4px; }
    #stop { background: #eee; border: 1px solid #ccc; border-radius: 4px; }
    #status { margin-top: 10px; line-height: 1.5; color: #333; }
    #error { color: #b91c1c; white-space: pre-wrap; }
    .muted { color: #777; font-size: 11px; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Artex-Moses-mode Traffic Capture</h1>

  <label for="serverUrl">Artex-Moses-mode URL</label>
  <input id="serverUrl" placeholder="http://localhost:8787" />
  <label for="token">Token</label>
  <input id="token" type="password" placeholder="Artex-Moses-mode JWT (localStorage artex_moses_mode_token)" />

  <label for="taskId">Engagement ID (empty for operator-only traffic)</label>
  <input id="taskId" type="number" min="1" step="1" />
  <label for="origins">Additional allowed origins (one per line)</label>
  <textarea id="origins" rows="2" placeholder="https://login.example.org"></textarea>
  <button id="save">Save settings</button>
  <button id="start">Start capture</button>
  <button id="stop">Stop</button>
  <button id="flush">Flush now</button>

  <button id="discard" hidden>Discard unsent batch</button>
  <div id="status"></div>
  <div id="error"></div>

  <p class="muted">
    Start on the intended tab. The recording includes its initial origin and the additional origins above. Saving changes applies to the next recording. Unassigned captures are visible only to the operator.
  </p>

  <script src="popup.js"></script>
</body>
</html>
